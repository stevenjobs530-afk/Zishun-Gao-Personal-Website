name: CI

# Pull-request checks. Nothing here deploys; deploy-pages.yml publishes main.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test rendered routes
        run: npm test

      - name: Build GitHub Pages export
        run: npm run build:github-pages

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Browser layout and accessibility tests
        run: npm run test:browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
